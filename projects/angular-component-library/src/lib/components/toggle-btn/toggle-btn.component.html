@if (label) {
    <p [ngClass]="customClassName">{{ label }}</p>
}

<div
    [ngClass]="['toggle', customClassName, sizeClass]"
    [style.margin-left.em]="label ? '0.25' : '0'"
    [class.disabled]="isDisabled">
    <input
        type="checkbox"
        class="checkbox"
        [attr.aria-label]="'toggle-btn'"
        [disabled]="isDisabled"
        [(ngModel)]="checked"
        (ngModelChange)="toggleState()" />
    <div class="track"></div>
</div>
