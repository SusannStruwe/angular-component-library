<div
    data-testid="collapse-header"
    tabindex="0"
    [ngClass]="['collapsible-header', customClassName]"
    (click)="collapseContent()"
    (keydown.enter)="collapseContent()"
    (keydown.space)="collapseContent()">
    <ng-content select="[header]"></ng-content>
</div>

<div
    data-testid="collapse-content"
    [ngClass]="['collapsible-content', customClassName]"
    [class.show]="show"
    [class.hide]="!show">
    <ng-content select="[content]"></ng-content>
</div>
