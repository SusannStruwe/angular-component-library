@if (mode === modes.WRITE) {
    <label
        class="checkbox"
        [style.height.px]="height ?? 30"
        [style.width.px]="height ?? 30">
        <input
            id="checkbox-{{ randomId }}"
            data-testid="checkbox"
            [attr.aria-label]="'checkbox'"
            type="checkbox"
            (change)="toggleValue()"
            [checked]="value" />

        <span
            class="checkmark"
            [style.height.px]="height ?? 30"
            [style.width.px]="height ?? 30">
            @if (value) {
                <fa-icon [icon]="faCheck"> </fa-icon>
            }
        </span>
    </label>
}
@if (mode === modes.READ) {
    <span class="read">
        <fa-icon [icon]="value ? faSquareCheck : faSquare"> </fa-icon>
    </span>
}
