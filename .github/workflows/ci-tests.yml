name: CI Tests

env:
    NODE_VERSION: '22'

on:
    push:
    pull_request:

jobs:
    install:
        name: Install and cache
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Cache node modules and Playwright browsers
              id: cache-node
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.npm
                      node_modules
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-playwright

            - name: Install npm dependencies
              run: npm install

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

    prettier:
        name: Check formatting
        runs-on: ubuntu-24.04
        needs: install
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Restore node modules cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-playwright

            - name: Install npm dependencies
              run: npm ci

            - name: Check code formatting with Prettier
              run: npm run prettier:check

    karma-test:
        name: Run karma tests
        runs-on: ubuntu-24.04
        needs: prettier
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Restore node modules cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.npm
                      node_modules
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-playwright

            - name: Run Karma tests (Headless Chrome)
              run: npm run test -- --watch=false --browsers=ChromeHeadless

    storybook-test:
        name: Run storybook tests
        runs-on: ubuntu-24.04
        needs: prettier
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Log Node.js version
              run: node -v

            - name: Restore cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.npm
                      node_modules
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-playwright

            - name: Build Storybook
              run: npm run build-storybook --quiet > storybook.log 2>&1

            - name: Serve Storybook and run tests
              run: |
                  npx http-server storybook-static --port 6006 --silent &
                  npx wait-on http://localhost:6006
                  npm run test-storybook || (echo "❌ Storybook tests failed" && exit 1)

            - name: Show Storybook Logs on Failure
              if: failure()
              run: cat storybook.log
